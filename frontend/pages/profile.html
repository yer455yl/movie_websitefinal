<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile • Kinotime</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <nav>
    <div class="brand">Kinotime</div>
    <div class="nav-links">
      <a href="../index.html">Home</a>
      <a href="login.html">Login</a>
      <a href="register.html">Register</a>
      <a href="movies.html">Library</a>
      <a href="search.html">Search</a>
      <button id="logoutBtn">Logout</button>
    </div>
  </nav>

  <main>
    <div class="panel" style="max-width: 640px; margin: 0 auto;">
      <h2>Your profile</h2>
      <p class="footer-note">Update your name or email to keep data in sync.</p>
      <form id="profileForm" class="form" style="margin-top: 18px;">
        <label>Name
          <input type="text" name="name" placeholder="Your name" />
        </label>
        <label>Email
          <input type="email" name="email" placeholder="you@email.com" required />
        </label>
        <button class="button primary" type="submit">Save changes</button>
      </form>
      <div id="status" class="status" style="margin-top: 16px;">Loading profile data...</div>
    </div>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/profile.js"></script>
</body>
</html>
